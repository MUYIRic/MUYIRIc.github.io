<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>暮易•日辰</title>
        <link rel="icon" href="./img/title-icon.png" type="image/png">
        <style>
            @font-face {
                font-family: "PoetsenOne";
                src: url("https://raw.githubusercontent.com/MUYIRic/MyFont/refs/heads/main/PoetsenOne-Regular.ttf") format("truetype");
                font-display: swap;
            }
            
            @font-face {
                font-family: "WireOne";
                src: url("https://raw.githubusercontent.com/MUYIRic/MyFont/refs/heads/main/WireOne-Regular.ttf") format("truetype");
                font-display: swap;
            }

            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            
            .container {
                position: relative;
                width: 100vw;
                height: 100vh;
                background: url(./img/ocean.jpg);
                /* layout */
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .container::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                z-index: 1;
            }

            .title {
                color: #fff;
                font-size: 12vw;
                margin-bottom: 20px;
                z-index: 999;
                font-weight: 700;
                animation: up 0.6s ease-in-out;
                font-family: "PoetsenOne";
            }

            .sentence {
                color: #fff;
                font-size: 4vw;
                margin-bottom: 100px;
                z-index: 999;
                animation: up 0.8s ease-in-out;
                font-family: "WireOne";
            }

            .btnGo {
                text-decoration: none;
                z-index: 999;
                transition: all 0.3s ease-in-out;
                animation: up 1s ease-in-out;
                /* btn-type */
                width: 180px;
                height: 50px;
                background: rgba(255, 255, 255, 0.15);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-radius: 25px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                /* layout */
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                /* text-type */
                color: #fff;
                font-size: 20px;
                font-weight: 700;
            }

            .btnGo:hover {
                transform: scale(1.1);
                box-shadow: 0 4px 10px rgba(190, 215, 223, 0.4);
            }

            .btnGo:active {
                transform: scale(0.95);
            }
            
            @keyframes up {
                0% {
                    transform: translateY(100px);
                }
                100% {
                    transform: translateY(0);
                }
            }

            .scroll {
                position: absolute;
                width: 20px;
                height: 25px;
                border: 2px solid rgba(255, 255, 255, 0.6);
                border-radius: 12px;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 999;
                animation: updown 5s ease-in-out infinite;
            }

            .scroll::before {
                content: "";
                position: absolute;
                width: 5px;
                height: 5px;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 50%;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 999;
                animation: scroll 1s  ease-in-out infinite ;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(-50%) translateY(-50%);
                }
                50% {
                    transform: translateX(-50%) translateY(50%);
                }
                100% {
                    transform: translateX(-50%) translateY(-50%);
                }
            }
            @keyframes updown {
                0%,20%,40%,60%,80%,100% {
                    transform: translateY(-50%);
                }
                
                10%,30%,50%,70%,90% {
                    transform: translateY(0);
                }

            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="title">Welcome</div>
            <div class="sentence">-I offer you the loyalty of a man who has never been loyal-</div>
            <a href="./login.html" class="btnGo">Embark</a>
            <div class="scroll">
            </div>
        </div>
    </body>
</html>
